name: KeineMagie
options:
  developmentLanguage: de
  knownRegions: [de, en, ru, es, fr]
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '17.0'
packages:
  KeineMagieCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 49PJNAT2WC
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  KeineMagie:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: KeineMagieCore
    entitlements:
      path: KeineMagie.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        # Only this app consumes CI signing inputs. Standard command-line signing
        # overrides would also provision SwiftPM resource bundles (unsupported).
        KM_CI_CODE_SIGN_STYLE: Automatic
        KM_CI_CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: "$(KM_CI_CODE_SIGN_STYLE)"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "$(KM_CI_CODE_SIGN_IDENTITY)"
        PROVISIONING_PROFILE: "$(KM_CI_PROVISIONING_PROFILE)"
        PROVISIONING_PROFILE_SPECIFIER: "$(KM_CI_PROVISIONING_PROFILE_SPECIFIER)"
        OTHER_CODE_SIGN_FLAGS: "$(KM_CI_OTHER_CODE_SIGN_FLAGS)"
        PRODUCT_BUNDLE_IDENTIFIER: de.keinemagie.app
        PRODUCT_NAME: KeineMagie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Config/Info.plist
      configs:
        Debug:
          INFOPLIST_FILE: Config/Info-Debug.plist
    scheme:
      testTargets: [KeineMagieUITests]
  KeineMagieUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: KeineMagie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.keinemagie.app.uitests
        GENERATE_INFOPLIST_FILE: YES
