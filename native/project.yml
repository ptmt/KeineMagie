name: KeineMagie
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '17.0'
packages:
  KeineMagieCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 49PJNAT2WC
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  KeineMagie:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: KeineMagieCore
    entitlements:
      path: KeineMagie.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.keinemagie.app
        PRODUCT_NAME: KeineMagie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Config/Info.plist
      configs:
        Debug:
          INFOPLIST_FILE: Config/Info-Debug.plist
    scheme:
      testTargets: []
