name: iOS TestFlight

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/ios-testflight.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-flight archive/upload. Serializing also protects build numbering.
concurrency:
  group: ios-testflight-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Stable version published in actions/runner-images macos-26 inventory.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select and report stable Xcode
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun swift --version
      - name: Validate CI configuration
        run: |
          python3 -m unittest discover -s native/ci -v
          bash -n native/ci/testflight.sh native/ci/cleanup.sh
          plutil -lint native/Config/Info.plist native/Config/Info-Debug.plist
      - name: Swift core tests
        run: swift test --package-path native/Core
      - name: Install XcodeGen and generate project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version
          xcodegen generate --spec native/project.yml
      - name: Unsigned simulator build
        run: |
          xcodebuild -project native/KeineMagie.xcodeproj -scheme KeineMagie \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/KeineMagie-simulator" CODE_SIGNING_ALLOWED=NO build
      - name: Verify effective app export-compliance metadata
        env:
          KM_BUILT_APP_PLIST: ${{ runner.temp }}/KeineMagie-simulator/Build/Products/Release-iphonesimulator/KeineMagie.app/Info.plist
        run: python3 -m unittest discover -s native/ci -p test_app_metadata.py -v

  testflight:
    # PRs (including forks) never enter the environment or receive signing secrets.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select and report stable Xcode; generate project
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version
          xcodegen generate --spec native/project.yml
      - name: Manually sign, export, validate, and upload
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash native/ci/testflight.sh
      - name: Remove signing material and restore keychain search list
        if: always()
        run: bash native/ci/cleanup.sh "${TESTFLIGHT_TEMP:-}"
